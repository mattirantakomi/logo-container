# The image ghcr.io/mattirantakomi/logo-container is PRIVATE by default, so the
# cluster needs credentials to pull it. Create a docker-registry secret.
#
# EASIEST: create it imperatively (do NOT commit the token):
#
#   kubectl create secret docker-registry ghcr-pull \
#     --namespace logo-soft \
#     --docker-server=ghcr.io \
#     --docker-username=mattirantakomi \
#     --docker-password='<YOUR_GHCR_PAT_with_read:packages>' \
#     --docker-email='you@example.com'
#
# The Deployment references this secret via imagePullSecrets: [{ name: ghcr-pull }].
#
# If you instead make the GHCR package PUBLIC (GitHub -> package -> Package
# settings -> Change visibility), you can delete the imagePullSecrets block from
# the Deployment and skip this secret entirely.
#
# This file is only a reminder; it intentionally contains no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: logo-soft
type: kubernetes.io/dockerconfigjson
data:
  # .dockerconfigjson: <base64 of ~/.docker/config.json with only the ghcr.io auth>
  .dockerconfigjson: ""
